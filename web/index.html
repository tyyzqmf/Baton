<script>
  try { if (localStorage.getItem('baton-sidebar-collapsed') === '1') document.documentElement.classList.add('sidebar-collapsed'); } catch (e) {}
  if (sessionStorage.getItem('baton-returning-home') === '1') {
    window.__returningHome = true;
    document.documentElement.classList.add('returning-home');
    sessionStorage.removeItem('baton-returning-home');
  }
  addEventListener('pageshow', function () {
    sessionStorage.removeItem('baton-returning-home');
  });

<!-- Critical CSS inline — prevents FOUC before bundled CSS loads (mobile webview cold start) -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--canvas);color:var(--text-primary);font-family:var(--font-ui);font-size:14px}
  html,body{height:100%;overflow:clip}
  body{display:flex;flex-direction:column;position:fixed;width:100%;top:0;left:0;bottom:0}
  .top-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 12px;padding-top:max(var(--sat,env(safe-area-inset-top)),6px);background:var(--surface-elevated);border-bottom:1px solid var(--border);flex-shrink:0}
  /* iOS WKWebView returns env(safe-area-inset-top)=0 for the first ~1s after launch.
     Floor it at 59px (Dynamic Island / notch device standard) to prevent the top-bar
     from briefly touching the top of the screen. -webkit-touch-callout is iOS-only,
     so Android skips this. Once env() resolves, the larger value naturally takes over. */
  @supports (-webkit-touch-callout:none){html.native-mobile-app .top-bar{min-height:calc(max(var(--sat,env(safe-area-inset-top,0px)),59px) + 44px);padding-top:max(var(--sat,env(safe-area-inset-top,0px)),59px)}}
  /* iOS WKWebView's frame settles ~50ms after first paint (status bar area gets cropped).
     Hide body briefly on iOS so users see the dark background instead of content jumping down.
     Android renders correctly on first frame, so it skips this. */
  @supports (-webkit-touch-callout:none){html.native-mobile-app body{opacity:0}html.native-mobile-app body.ready{opacity:1;transition:none}}
  .top-left{font-size:13px;display:flex;align-items:center;gap:4px;padding:14px 0 14px 24px;margin:-14px 0 -14px -24px}
  .top-logo{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:3px}
  .top-logo img{display:block;width:100%;height:100%}
  .top-title{font-weight:600;color:var(--text-primary)}
  a.top-gear,a.top-gear:link,a.top-gear:visited{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:var(--text-muted);text-decoration:none}
  a.top-gear.syncing,.new-session-btn{position:relative}
  @keyframes apk-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  a.top-gear.syncing,#top-right.syncing .top-gear{animation:apk-spin 1.8s linear infinite;transition:none}
  #top-right.syncing .new-session-btn svg{border-color:transparent}
  #top-right.syncing .new-session-btn::after{content:"";position:absolute;left:3px;top:3px;box-sizing:border-box;width:22px;height:22px;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:apk-spin .7s linear infinite;pointer-events:none}
  .runtime-mark{display:inline-flex;width:16px;height:16px;flex:0 0 16px;align-items:center;justify-content:center;vertical-align:middle}
  .runtime-icon{display:block;width:16px;height:16px;object-fit:contain}
  .runtime-mark-codex{position:relative}.runtime-mark-codex .runtime-icon{visibility:hidden}.runtime-mark-codex::before{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;background:var(--text-muted);transform:translate(-50%,-50%);-webkit-mask:var(--runtime-codex-image,url("assets/codex.svg")) center/contain no-repeat;mask:var(--runtime-codex-image,url("assets/codex.svg")) center/contain no-repeat;transition:background .15s}
  @media(hover:hover) and (pointer:fine){#top-right>.runtime-mark-codex:hover::before,.runtime-switch:hover .runtime-mark-codex::before{background:var(--text-primary)}}
  html.native-mobile .top-bar{min-height:calc(var(--sat,env(safe-area-inset-top,0px)) + 44px);padding:var(--sat,env(safe-area-inset-top,0px)) 8px 0 12px;border-bottom:0;box-shadow:inset 0 -1px var(--border)}
  html.native-mobile .top-left{min-height:44px;gap:6px;font-size:17px;line-height:21px}
  html.native-mobile .top-logo{width:20px;height:21px;line-height:21px;flex:0 0 20px;margin-right:0}
  html.native-mobile .top-title{display:inline-flex;align-items:center;height:21px;line-height:21px}
  html.native-mobile #top-right{display:flex;align-items:center;min-height:44px;gap:0;line-height:0}
  html.native-mobile a.top-gear,html.native-mobile a.top-gear:link,html.native-mobile a.top-gear:visited{width:44px;height:44px}
  html.native-mobile a.top-gear svg{width:22px;height:22px}
  html.native-mobile .new-session-btn,html.native-mobile .runtime-switch,html.native-mobile #top-right>.runtime-mark{width:44px;height:44px;flex:0 0 44px;margin:0}
  html.native-mobile .new-session-btn svg{width:26px;height:26px;padding:4px;border-width:1.5px}
  html.native-mobile #top-right .runtime-mark,html.native-mobile #top-right .runtime-icon{width:24px;height:24px}
  html.native-mobile #top-right .runtime-mark{flex-basis:24px}
  #top-right .runtime-mark-codex::before{width:22px;height:22px}
  html.native-mobile #top-right .runtime-mark-codex::before{width:24px;height:24px;transform:translate(-50%,-50%)}
  html.native-mobile #top-right>.runtime-mark{width:44px;height:44px;flex-basis:44px}
  html.native-mobile #top-right.syncing .new-session-btn::after{left:9px;top:9px;width:26px;height:26px;border-width:1.5px}
  .breadcrumb{display:none;flex-shrink:0}
  #content{flex:1;overflow-y:auto}
  body.browse-view #content{overflow-y:scroll;scrollbar-gutter:stable}
</style>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/shell.css">
<!-- Inline shell: auth guard + parallel fetch (devices + active-sessions) + first paint.
     Runs before entry-index.js so the network request flies out at HTML parse time.
     entry-index.js loads in parallel (browser default for type=module) and takes over interactivity. -->
<script>
(function () {
  // Start URL shortcut: any ?t=<token> or ?key=<key> belongs on landing.html
  // (where the exchange + login flow lives). Forward the query immediately,
  // before reading credentials, so links work whether or not user is signed in.
  if (/[?&](t|key)=/.test(location.search)) {
    location.replace('landing.html' + location.search);
    return;
  }
  var key = '';
  try { key = atob(localStorage.getItem('_ak') || ''); } catch (e) {}
  if (!key) { location.replace('landing.html'); return; }
  var server = (localStorage.getItem('_as') || (location.origin + location.pathname.replace(/\/[^/]*$/, ''))).replace(/\/$/, '');
  var hdr = { 'x-api-key': key };

  // Fire both requests immediately (network flies out before any other JS loads).
  window.__preload = {
    active: fetch(server + '/api/bridge/active-sessions', { headers: hdr }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    devices: fetch(server + '/api/bridge/devices', { headers: hdr }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  };

  // SWR home cache (fixed key, cleared by api.js on logout/key change). Stores raw responses with ISO timestamps so timeAgo() recomputes correctly next open; also drives the compare-skip.
  var CACHE_KEY = 'apeek_home_cache';
  var recentProjectsCollapsed = false;
  var devicesCollapsed = false;
  var collapsedRecentProjects = new Set();
  var allRecentProjects = false;
  var loadingRecentProjects = false;
  var homeActiveData = null;
  var homeDeviceData = null;
  var homeLoadVersion = 0;
  window.__homeActiveParams = function () {
    return allRecentProjects ? { allProjects: true } : undefined;
  };
  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; }
  }
  function writeCache(active, devices) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ active: active, devices: devices, cachedAt: Date.now() })); } catch (e) {}
    try { window.dispatchEvent(new CustomEvent('baton:home-data', { detail: { active: active, devices: devices } })); } catch (e) {}
  }
  // Shared top-right activity indicator for all cached list refreshes.
  function setSync(syncing) {
    var topRight = document.getElementById('top-right');
    if (!topRight) return;
    topRight.classList.toggle('syncing', syncing);
    var legacyGear = topRight.querySelector('.top-gear.syncing');
    if (legacyGear) legacyGear.classList.remove('syncing');
  }
  function stopSync() {
    setSync(false);
  }

  // If user lands on a deep link (#/device/...) OR a saved nav points into a
  // project/session, let app.js handle routing (it restores the deeper view).
  // Only inline-render the home/device-list case (empty hash + top-level nav).
  var hash = (location.hash || '').replace(/^#\/?/, '');
  var navDeep = false;
  try {
    var _nav = JSON.parse(sessionStorage.getItem('baton-nav') || '{}');
    navDeep = !!(_nav && (_nav.session || _nav.project));
  } catch (e) {}
  var willRenderInline = !hash && !navDeep;

  var firstWebFrameReadyScheduled = false;
  var firstWebFrameObserver = null;
  function markFirstWebFrameReady() {
    if (window.__skelReady || firstWebFrameReadyScheduled) return;
    firstWebFrameReadyScheduled = true;
    var nextFrame = window.requestAnimationFrame || function (fn) { setTimeout(fn, 0); };
    // Let the Web skeleton or cached content complete two layouts before the
    // native overlay fades. Then allow the iOS body reveal transition and WebKit
    // compositor to settle so the native fade never exposes a dim Web frame.
    nextFrame(function () {
      nextFrame(function () {
        if (document.body) document.body.classList.add('ready');
        setTimeout(function () {
          window.__skelReady = 1;
          if (firstWebFrameObserver) {
            firstWebFrameObserver.disconnect();
            firstWebFrameObserver = null;
          }
        }, 120);
      });
    });
  }
  window.__markFirstWebFrameReady = markFirstWebFrameReady;

  function observeFirstWebFrame(content) {
    if (!content || firstWebFrameObserver || window.__skelReady) return;
    var check = function () {
      if (!content.firstElementChild) return;
      markFirstWebFrameReady();
    };
    firstWebFrameObserver = new MutationObserver(check);
    firstWebFrameObserver.observe(content, {
      childList: true,
      subtree: true
    });
    check();
  }

  function timeAgo(iso) {
    var d = Date.now() - new Date(iso).getTime();
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.floor(d / 60000) + 'm ago';
    if (d < 86400000) return Math.floor(d / 3600000) + 'h ago';
    return Math.floor(d / 86400000) + 'd ago';
  }
  function osName(os) { return { darwin: 'macOS', linux: 'Linux', win32: 'Windows' }[os] || os || 'unknown'; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function attachmentPreviewText(text) {
    return text.replace(/\[([^\]\r\n]*)\]\((?:baton-file:([0-9a-f]{32}(?:\.[a-z0-9]{1,16})?)|<[^<>\r\n]*[\\/]\.baton-bridge[\\/]attachments[\\/]([0-9a-f]{32}(?:\.[a-z0-9]{1,16})?)>)\)/g,
      function (reference, label) {
        try { return decodeURIComponent(label); } catch (error) { return reference; }
      });
  }
  var runtimeIconCacheKey = 'baton-runtime-icons-v1';
  var runtimeIconCache = {};
  var runtimeIconPending = {};
  function validRuntimeSvg(svg) {
    return typeof svg === 'string' && svg.length < 16384 && /^<svg\s[\s\S]*<\/svg>\s*$/.test(svg);
  }
  try {
    var savedIcons = JSON.parse(sessionStorage.getItem(runtimeIconCacheKey) || '{}');
    ['claude', 'codex'].forEach(function (runtime) {
      if (savedIcons && validRuntimeSvg(savedIcons[runtime])) runtimeIconCache[runtime] = savedIcons[runtime];
    });
  } catch (e) {}
  function runtimeIconSource(runtime) {
    var svg = runtimeIconCache[runtime];
    return svg ? 'data:image/svg+xml,' + encodeURIComponent(svg)
      : './assets/' + (runtime === 'codex' ? 'codex.svg' : 'claude-code.svg');
  }
  window.__runtimeIconSource = runtimeIconSource;
  if (runtimeIconCache.codex) {
    document.documentElement.style.setProperty('--runtime-codex-image', 'url("' + runtimeIconSource('codex') + '")');
  }
  document.addEventListener('load', function (event) {
    var image = event.target;
    if (image.tagName !== 'IMG' || !image.classList.contains('runtime-icon')) return;
    var runtime = image.closest('.runtime-mark-codex') ? 'codex' : 'claude';
    if (runtimeIconCache[runtime] || runtimeIconPending[runtime]) return;
    runtimeIconPending[runtime] = true;
    fetch(image.currentSrc || image.src, { cache: 'force-cache' }).then(function (response) {
      return response.ok ? response.text() : '';
    }).then(function (svg) {
      if (!validRuntimeSvg(svg)) return;
      runtimeIconCache[runtime] = svg;
      try { sessionStorage.setItem(runtimeIconCacheKey, JSON.stringify(runtimeIconCache)); } catch (e) {}
    }).catch(function () {}).finally(function () {
      delete runtimeIconPending[runtime];
    });
  }, true);
  function runtimeIcon(s) {
    var runtime = String(s.sessionId || '').indexOf('codex:') === 0 ? 'codex' : 'claude';
    var label = runtime === 'codex' ? 'Codex' : 'Claude Code';
    return '<span class="runtime-mark' + (runtime === 'codex' ? ' runtime-mark-codex' : '') + '" role="img" aria-label="' + label + '" title="' + label + '">'
      + '<img class="runtime-icon" width="16" height="16" decoding="sync" src="' + esc(runtimeIconSource(runtime)) + '" alt="" aria-hidden="true"></span>';
  }

  // Home tabs (Tasks / Approve / Review), host filter and local pins.
  var HOME_TABS = ['tasks', 'approve', 'review'];
  var homeTab = sessionStorage.getItem('baton-home-tab');
  if (HOME_TABS.indexOf(homeTab) < 0) homeTab = 'tasks';
  var homeHost = sessionStorage.getItem('baton-home-host') || '';
  var collapseIcon = '<svg class="collapse-arrow" width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>';
  var chevronIcon = '<svg class="row-chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>';
  var folderIcon = '<svg class="recent-project-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<g class="recent-folder-closed"><path d="M3 9V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"/><path d="M3 9h18"/></g></svg>';
  var reviewIcon = '<svg class="recent-project-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<circle cx="6" cy="6" r="2.25"/><circle cx="6" cy="18" r="2.25"/><circle cx="18" cy="8" r="2.25"/><path d="M6 8.25v7.5M18 10.25c0 4-4 4.5-9.5 6"/></svg>';

  function readPins() {
    try {
      var pins = JSON.parse(localStorage.getItem('baton-pins') || '[]');
      return Array.isArray(pins) ? pins.filter(function (pin) {
        return pin && pin.sessionId && pin.deviceName && pin.projectHash;
      }) : [];
    } catch (e) { return []; }
  }
  window.__readPins = readPins;

  function deviceLabel(deviceName) {
    return (window.__deviceDisplayNames || {})[deviceName] || deviceName;
  }
  function compactAgo(iso) {
    var elapsed = timeAgo(iso);
    return elapsed === 'just now' ? 'now' : elapsed.replace(' ago', '');
  }
  function statusKey(status) {
    return status === 'running' ? 'running' : status === 'needs_input' ? 'needs-input' : 'done';
  }
  function statusText(status) {
    return status === 'running' ? 'Running' : status === 'needs_input' ? 'Needs input' : 'Done';
  }
  function sessionKey(s) { return JSON.stringify([s.deviceName, s.sessionId]); }
  function timeValue(iso) { return Date.parse(iso || '') || 0; }

  // Active sessions are authoritative for running/needs input; recent project rows fill in the rest.
  function homeTasks(activeData) {
    var byKey = {};
    var list = [];
    function add(s) {
      if (!s || !s.sessionId || !s.deviceName || byKey[sessionKey(s)]) return;
      byKey[sessionKey(s)] = s;
      list.push(s);
    }
    ((activeData && activeData.sessions) || []).forEach(add);
    ((activeData && activeData.recentProjects) || []).forEach(function (project) {
      (project.sessions || []).forEach(function (s) {
        add(Object.assign({ deviceName: project.deviceName, projectHash: project.projectHash, projectName: project.projectName }, s));
      });
    });
    list.sort(function (a, b) { return timeValue(b.lastActive) - timeValue(a.lastActive); });
    return { list: list, byKey: byKey };
  }
  window.__homeTasks = function () { return homeTasks(homeActiveData || (readCache() || {}).active); };

  function taskRowHtml(s) {
    var title = s.isAgent && s.agentName ? s.agentName : attachmentPreviewText(s.preview || 'No preview');
    var href = '#/' + encodeURIComponent(s.deviceName) + '/' + encodeURIComponent(s.projectHash) + '/' + encodeURIComponent(s.sessionId);
    var agentCount = Math.max(0, Number(s.agentCount) || 0);
    var meta = '<span class="task-project">' + esc(s.projectName || s.projectHash) + '</span>'
      + '<span class="task-device">' + esc(deviceLabel(s.deviceName)) + '</span>'
      + (agentCount ? '<span class="badge agent">' + agentCount + ' agent' + (agentCount === 1 ? '' : 's') + '</span>'
        : s.isAgent ? '<span class="badge agent">Agent</span>' : '');
    var detail = s.status === 'needs_input' && s.agentDetail ? s.agentDetail : '';
    return '<a class="task-row task-' + statusKey(s.status) + '" href="' + esc(href) + '" data-nav="active"'
      + ' data-sid="' + esc(s.sessionId) + '" data-preview="' + esc(s.preview || '') + '"'
      + ' data-device="' + esc(s.deviceName) + '" data-phash="' + esc(s.projectHash) + '"'
      + ' data-pname="' + esc(s.projectName || s.projectHash) + '" data-isagent="' + (s.isAgent ? 'true' : '') + '"'
      + ' title="' + esc(title + (detail ? '\n' + detail : '')) + '">'
      + '<span class="task-status" role="img" aria-label="' + statusText(s.status) + '"></span>'
      + '<span class="task-main"><span class="task-title">' + esc(title) + '</span>'
      + '<span class="task-meta">' + meta + '</span>'
      + (detail ? '<span class="task-detail">' + esc(detail) + '</span>' : '') + '</span>'
      + '<span class="task-side">' + runtimeIcon(s) + '<time class="task-time" datetime="' + esc(s.lastActive || '') + '"'
      + ' aria-label="' + esc(timeAgo(s.lastActive)) + '">' + compactAgo(s.lastActive) + '</time></span></a>';
  }

  function taskGroupHtml(label, rows) {
    return '<div class="home-group"><h2 class="home-group-title">' + label + '</h2>'
      + '<div class="home-group-rows">' + rows.map(taskRowHtml).join('') + '</div></div>';
  }

  function tasksHtml(tasks, matchesHost) {
    var pinnedKeys = {};
    var pinned = readPins().filter(matchesHost).map(function (pin) {
      pinnedKeys[sessionKey(pin)] = true;
      return tasks.byKey[sessionKey(pin)] || pin;
    });
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    var groups = { Today: [], Yesterday: [], Earlier: [] };
    tasks.list.filter(function (s) { return matchesHost(s) && !pinnedKeys[sessionKey(s)]; }).slice(0, 40)
      .forEach(function (s) {
        var time = timeValue(s.lastActive);
        groups[time >= today.getTime() ? 'Today' : time >= yesterday.getTime() ? 'Yesterday' : 'Earlier'].push(s);
      });
    var html = pinned.length ? taskGroupHtml('Pinned', pinned) : '';
    ['Today', 'Yesterday', 'Earlier'].forEach(function (label) {
      if (groups[label].length) html += taskGroupHtml(label, groups[label]);
    });
    return '<section class="home-tasks" aria-label="Sessions">'
      + (html || '<p class="home-empty">No sessions yet</p>') + '</section>';
  }

  function hostChipsHtml(devs) {
    if (devs.length < 2) return '';
    function chip(name, label, online) {
      var active = homeHost === name;
      return '<button class="host-chip' + (active ? ' active' : '') + '" type="button" data-host="' + esc(name) + '" aria-pressed="' + active + '">'
        + (name ? '<span class="device-dot ' + (online ? 'online' : 'offline') + '"></span>' : '') + esc(label) + '</button>';
    }
    return '<div class="home-hosts" role="group" aria-label="Devices">' + chip('', 'All', true)
      + devs.map(function (d) { return chip(d.deviceName, d.deviceDisplayName || d.deviceName, d.online); }).join('') + '</div>';
  }

  function moreProjectsControl() {

    return '<button class="recent-projects-show-more' + (loadingRecentProjects ? ' recent-projects-loading' : '')
      + '" type="button" data-show-more-projects' + (loadingRecentProjects ? ' disabled aria-busy="true"' : '') + '>'
      + (loadingRecentProjects ? 'Loading…' : 'Show more') + '</button>';
  }

  function showMoreProjects() {
    if (loadingRecentProjects) return;
    var footer = document.getElementById('recent-projects-footer');
    if (!footer) return;
    var button = footer.querySelector('[data-show-more-projects]');
    if (!button) return;
    var previousMode = allRecentProjects;
    var account = localStorage.getItem('_ak');
    var accountServer = localStorage.getItem('_as');
    var devices = homeDeviceData || (readCache() || {}).devices || { devices: [] };
    allRecentProjects = true;
    loadingRecentProjects = true;
    button.textContent = 'Loading…';
    button.disabled = true;
    button.classList.add('recent-projects-loading');
    button.setAttribute('aria-busy', 'true');
    var activePromise = Promise.resolve().then(function () {
      return window.api('/api/bridge/active-sessions', { allProjects: true });
    }).then(function (data) {
      if (!Array.isArray(data.recentProjects) || data.hasMoreProjects !== false) {
        throw new Error('Incomplete project snapshot');
      }
      return data;
    });
    var run = loadHome(activePromise, Promise.resolve(devices), {
      keepContent: true,
      appendProjects: true,
      isCurrent: function () {
        return !!document.getElementById('recent-projects-section')
          && localStorage.getItem('_ak') === account
          && localStorage.getItem('_as') === accountServer;
      }
    });
    var version = homeLoadVersion;
    run.then(function (fresh) {
      if (version !== homeLoadVersion) return;
      loadingRecentProjects = false;
      if (!fresh) {
        allRecentProjects = previousMode;
        var currentFooter = document.getElementById('recent-projects-footer');
        if (currentFooter) currentFooter.innerHTML =
          '<span class="recent-projects-error" role="alert">Unable to load more projects.</span>' + moreProjectsControl();
      }
    });
  }

  function bindHomeNavigation(content) {
    if (content.__homeNavBound) return;
    content.__homeNavBound = true;
    content.addEventListener('click', function (e) {
      if (e.target.closest('[data-show-more-projects]')) {
        if (typeof window.api === 'function') showMoreProjects();
        else (window.__navQueue = window.__navQueue || []).push(showMoreProjects);
        return;
      }
      var toggle = e.target.closest('[data-home-toggle]');
      if (toggle) {
        var panel = document.getElementById(toggle.getAttribute('aria-controls'));
        if (!panel) return;
        var expanded = toggle.getAttribute('aria-expanded') !== 'true';
        toggle.setAttribute('aria-expanded', String(expanded));
        panel.hidden = !expanded;
        var key = toggle.dataset.homeToggle;
        if (key === 'recent-projects') recentProjectsCollapsed = !expanded;
        else if (key === 'devices') devicesCollapsed = !expanded;
        else if (expanded) collapsedRecentProjects.delete(key);
        else collapsedRecentProjects.add(key);
        return;
      }
      var host = e.target.closest('[data-host]');
      if (host) {
        homeHost = host.dataset.host || '';
        try { sessionStorage.setItem('baton-home-host', homeHost); } catch (err) {}
        renderInline(homeActiveData || {}, homeDeviceData || { devices: [] });
        return;
      }
      var t = e.target.closest('[data-nav]');
      if (!t || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button > 0) return;
      e.preventDefault();
      var act = t.dataset.nav;
      var run = function () {
        if (act === 'device' && typeof window.loadProjects === 'function') window.loadProjects(t.dataset.name);
        else if (act === 'project' && typeof window.loadSessions === 'function') window.loadSessions(t.dataset.device, t.dataset.phash, t.dataset.pname);
        else if (act === 'active' && typeof window.openActiveSession === 'function') window.openActiveSession(t);
        else if (act === 'review' && typeof window.openProjectReview === 'function') window.openProjectReview(t.dataset.device, t.dataset.phash, t.dataset.pname);
      };
      if (typeof window.loadProjects === 'function') run();
      else (window.__navQueue = window.__navQueue || []).push(run);
    });
  }

  function bindTabBar() {
    var bar = document.getElementById('tab-bar');
    if (!bar || bar.__bound) return;
    bar.__bound = true;
    bar.addEventListener('click', function (e) {
      var tab = e.target.closest('[data-home-tab]');
      if (tab) { setHomeTab(tab.dataset.homeTab); return; }
      if (!e.target.closest('[data-home-new]')) return;
      var run = function () { window.openNewTaskSheet(); };
      if (typeof window.openNewTaskSheet === 'function') run();
      else (window.__navQueue = window.__navQueue || []).push(run);
    });
  }

  function updateTabBar(tasks) {
    var bar = document.getElementById('tab-bar');
    if (!bar) return;
    bindTabBar();
    var waiting = tasks.list.filter(function (s) { return s.status === 'needs_input'; }).length;
    bar.querySelectorAll('[data-home-tab]').forEach(function (tab) {
      var active = tab.dataset.homeTab === homeTab;
      tab.classList.toggle('active', active);
      if (active) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    });
    var badge = bar.querySelector('.tab-bar-badge');
    if (badge) {
      badge.textContent = waiting > 9 ? '9+' : String(waiting);
      badge.hidden = !waiting;
    }
  }

  function setHomeTab(tab) {
    homeTab = HOME_TABS.indexOf(tab) < 0 ? 'tasks' : tab;
    try { sessionStorage.setItem('baton-home-tab', homeTab); } catch (e) {}
    if (!document.body.classList.contains('view-home') || !(homeActiveData || homeDeviceData)) return;
    renderInline(homeActiveData || {}, homeDeviceData || { devices: [] });
    var content = document.getElementById('content');
    if (content) content.scrollTop = 0;
  }
  window.__setHomeTab = setHomeTab;
  window.__homeTab = function () { return homeTab; };
  window.__homeProjects = function () {
    return (homeActiveData && homeActiveData.recentProjects) || ((readCache() || {}).active || {}).recentProjects || [];
  };

  function restoreReturningHomePreview(snapshot) {

    var returningFromSettings = !snapshot;
    if (returningFromSettings) {
      if (!window.__returningHome) return false;
      if (window.__homePreviewRestored) return true;
      try {
        snapshot = JSON.parse(sessionStorage.getItem('baton-page-preview') || 'null');
      } catch (e) {}
    }
    if (!snapshot || typeof snapshot.contentHtml !== 'string') return false;

    var topBar = document.querySelector('body > .top-bar');
    var breadcrumb = document.getElementById('breadcrumb');
    var content = document.getElementById('content');
    if (!topBar || !breadcrumb || !content) return false;

    topBar.innerHTML = snapshot.topBarHtml || '';
    breadcrumb.innerHTML = snapshot.breadcrumbHtml || '';
    breadcrumb.style.display = snapshot.breadcrumbDisplay || 'none';
    var preview = document.createElement('template');
    preview.innerHTML = snapshot.contentHtml;
    preview.content.querySelectorAll('img.runtime-icon').forEach(function (image) {
      image.src = runtimeIconSource(image.closest('.runtime-mark-codex') ? 'codex' : 'claude');
    });
    content.replaceChildren(preview.content);
    document.body.classList.add('view-home');
    updateTabBar(homeTasks(homeActiveData || (readCache() || {}).active));
    content.scrollTop = snapshot.scrollTop || 0;
    if (returningFromSettings) sessionStorage.removeItem('baton-page-preview');
    bindHomeNavigation(content);
    document.body.classList.add('ready');
    window.__inlineRendered = true;
    if (returningFromSettings) window.__homePreviewRestored = true;
    markFirstWebFrameReady();
    return true;
  }
  window.__restoreHomePreview = restoreReturningHomePreview;

  function recentProjectHtml(project, index, review) {
    var href = '#/' + encodeURIComponent(project.deviceName) + '/' + encodeURIComponent(project.projectHash);
    var latest = '';
    var running = 0;
    var waiting = 0;
    (project.sessions || []).forEach(function (s) {
      if (timeValue(s.lastActive) > timeValue(latest)) latest = s.lastActive;
      if (s.status === 'running') running++;
      else if (s.status === 'needs_input') waiting++;
    });
    var status = waiting ? '<span class="project-status needs-input" role="img" aria-label="' + waiting + ' needs input"></span>'
      : running ? '<span class="project-status running" role="img" aria-label="' + running + ' running"></span>' : '';
    return '<a class="recent-project' + (review ? ' review-project' : '') + '"' + (review ? '' : ' id="recent-project-' + index + '"')
      + ' href="' + esc(href) + '" data-nav="' + (review ? 'review' : 'project') + '" data-device="' + esc(project.deviceName) + '"'
      + ' data-phash="' + esc(project.projectHash) + '" data-pname="' + esc(project.projectName) + '" title="' + esc(project.projectName) + '">'
      + (review ? reviewIcon : folderIcon)
      + '<span class="recent-project-context"><span class="recent-project-name">' + esc(project.projectName) + '</span>'
      + '<span class="recent-project-device">' + esc(deviceLabel(project.deviceName)) + '</span></span>'
      + status + (latest ? '<time class="recent-project-time" datetime="' + esc(latest) + '">' + compactAgo(latest) + '</time>' : '')
      + chevronIcon + '</a>';
  }

  function appendRecentProjects(fresh) {
    var content = document.getElementById('content');
    var footer = document.getElementById('recent-projects-footer');
    var current = homeActiveData || (readCache() || {}).active;
    if (!footer || !current) throw new Error('Home is no longer available');
    var existing = current.recentProjects || [];
    var seen = new Set(existing.map(function (p) { return JSON.stringify([p.deviceName, p.projectHash]); }));
    var added = [];
    fresh.recentProjects.forEach(function (p) {
      var key = JSON.stringify([p.deviceName, p.projectHash]);
      if (seen.has(key) || added.length >= 10 || existing.length + added.length >= 15) return;
      seen.add(key);
      added.push(p);
    });
    var keepScroll = content.scrollTop;
    footer.insertAdjacentHTML('beforebegin', added.map(function (p, i) {
      return !homeHost || p.deviceName === homeHost ? recentProjectHtml(p, existing.length + i) : '';
    }).join(''));
    footer.remove();
    content.scrollTop = keepScroll;
    // Cache exactly what remains displayed; a normal home refresh replaces it
    // with current activity and the latest project ordering.
    homeActiveData = Object.assign({}, current, {
      recentProjects: existing.concat(added), hasMoreProjects: false,
    });
    return homeActiveData;
  }

  function projectsSectionHtml(projects, hasMore, matchesHost) {
    return '<section id="recent-projects-section" aria-labelledby="recent-projects-heading">'
      + '<h2 class="section-title home-section-heading" id="recent-projects-heading">'
      + '<button class="home-section-toggle recent-projects-toggle" type="button" data-home-toggle="recent-projects" aria-expanded="' + !recentProjectsCollapsed + '" aria-controls="recent-project-list">'
      + 'Projects' + collapseIcon + '</button></h2>'
      + '<div class="recent-project-list" id="recent-project-list"' + (recentProjectsCollapsed ? ' hidden' : '') + '>'
      + projects.map(function (p, i) { return matchesHost(p) ? recentProjectHtml(p, i) : ''; }).join('')
      + (projects.length ? '' : '<p class="recent-projects-empty">No recent sessions yet</p>')
      + (hasMore ? '<div class="recent-projects-footer" id="recent-projects-footer">' + moreProjectsControl() + '</div>' : '')
      + '</div></section>';
  }

  function devicesHtml(devs) {
    if (!devs.length) return '';
    return '<section class="home-devices" aria-labelledby="devices-heading">'
      + '<h2 class="section-title home-section-heading" id="devices-heading">'
      + '<button class="home-section-toggle devices-toggle" type="button" data-home-toggle="devices" aria-expanded="' + !devicesCollapsed + '" aria-controls="devices-section">'
      + 'Devices' + collapseIcon + '</button></h2>'
      + '<div id="devices-section" class="home-device-list"' + (devicesCollapsed ? ' hidden' : '') + '>'
      + devs.map(function (d) {
        var rc = d.runningCount || 0, ic = d.needsInputCount || 0;
        return '<a class="item device-item device-card" href="#/' + esc(encodeURIComponent(d.deviceName)) + '" data-nav="device" data-name="' + esc(d.deviceName) + '">'
          + '<div class="item-top"><span class="device-dot ' + (d.online ? 'online' : 'offline') + '"></span><span class="title">' + esc(d.deviceDisplayName || d.deviceName) + '</span><span class="item-time">' + timeAgo(d.lastActive) + '</span></div>'
          + '<div class="item-bottom"><span class="subtitle">' + osName(d.os) + ' &middot; ' + d.projectCount + ' projects</span><span class="item-status">' + rc + ' running &middot; ' + ic + ' needs input</span></div>'
          + '</a>';
      }).join('') + '</div></section>';
  }

  function homeViewHeading(title, hint) {
    return '<div class="home-view-heading"><h2 class="home-view-title" id="home-view-title">' + title + '</h2>'
      + '<p class="home-view-hint">' + hint + '</p></div>';
  }

  function approveHtml(tasks, matchesHost) {
    var rows = tasks.list.filter(function (s) { return s.status === 'needs_input' && matchesHost(s); });
    return '<section class="home-tasks home-approve" aria-labelledby="home-view-title">'
      + homeViewHeading('Needs input', 'Sessions waiting for an approval or an answer.')
      + (rows.length ? '<div class="home-group-rows">' + rows.map(taskRowHtml).join('') + '</div>'
        : '<p class="home-empty">Nothing needs your input.</p>')
      + '</section>';
  }

  function reviewHtml(projects, matchesHost) {
    var rows = projects.filter(matchesHost);
    return '<section class="home-review" aria-labelledby="home-view-title">'
      + homeViewHeading('Review', 'Open a project’s Git changes.')
      + (rows.length ? '<div class="home-group-rows">' + rows.map(function (p, i) { return recentProjectHtml(p, i, true); }).join('') + '</div>'
        : '<p class="home-empty">No recent projects.</p>')
      + '</section>';
  }

  function renderInline(activeData, devData) {
    var content = document.getElementById('content');
    if (!content) return;
    homeActiveData = activeData;
    homeDeviceData = devData;
    var devs = (devData && devData.devices) || [];
    var deviceDisplayNames = {};
    devs.forEach(function (device) {
      deviceDisplayNames[device.deviceName] = device.deviceDisplayName || device.deviceName;
    });
    window.__deviceDisplayNames = deviceDisplayNames;
    if (homeHost && !devs.some(function (d) { return d.deviceName === homeHost; })) homeHost = '';
    var matchesHost = function (item) { return !homeHost || item.deviceName === homeHost; };
    var recentProjects = activeData && activeData.recentProjects;
    var hasMoreProjects = false;
    if (Array.isArray(recentProjects)) {
      hasMoreProjects = activeData.hasMoreProjects || (!allRecentProjects && recentProjects.length > 5);
      recentProjects = recentProjects.slice(0, allRecentProjects ? 15 : 5);
      homeActiveData = Object.assign({}, activeData, { recentProjects: recentProjects, hasMoreProjects: hasMoreProjects });
    }
    var tasks = homeTasks(homeActiveData);
    var html = '';
    if (homeTab === 'approve') html = approveHtml(tasks, matchesHost);
    else if (homeTab === 'review') html = reviewHtml(recentProjects || [], matchesHost);
    else if (devs.length || tasks.list.length || Array.isArray(recentProjects)) {
      html = tasksHtml(tasks, matchesHost)
        + (Array.isArray(recentProjects) ? projectsSectionHtml(recentProjects, hasMoreProjects, matchesHost) : '')
        + devicesHtml(devs.filter(matchesHost));
    }
    if (!html) html = '<div class="empty">No devices yet</div>';
    content.innerHTML = hostChipsHtml(devs) + html;
    document.body.classList.add('view-home');
    updateTabBar(tasks);
    if (window.__returningHome) document.body.classList.add('ready');
    bindHomeNavigation(content);

    // Preheat viewer libs after 1.5s — yields IPC/main thread to navigation on Tauri.
    if (typeof window.loadViewerLibs === 'function') setTimeout(window.loadViewerLibs, 1500);
    else window.__preheatViewer = true;

    window.__inlineRendered = true;
    markFirstWebFrameReady();
  }

  // Without cache, the Web skeleton mirrors the native launch layout.
  function skelRow() {
    return '<div class="task-row skeleton-row"><span class="task-status"></span>'
      + '<span class="task-main"><span class="task-title"><span class="skel skel-w60 skel-h14"></span></span>'
      + '<span class="task-meta"><span class="skel skel-w40"></span></span></span>'
      + '<span class="task-side"><span class="skel skel-w16"></span></span></div>';
  }
  function renderSkeleton(force) {
    var content = document.getElementById('content');
    if (!content || (window.__inlineRendered && !force)) return;
    content.innerHTML = '<section class="home-tasks" aria-hidden="true"><div class="home-group">'
      + '<h2 class="home-group-title">Today</h2><div class="home-group-rows">'
      + skelRow() + skelRow() + skelRow() + skelRow() + skelRow() + '</div></div></section>';
    document.body.classList.add('view-home');
    if (document.body) document.body.classList.add('ready');
    markFirstWebFrameReady();
  }

  // Wait for #content to be parsed, not DOMContentLoaded — avoids waiting for module chunks.
  function whenContentReady(fn) {
    if (document.getElementById('content')) return fn();
    var iv = setInterval(function () {
      if (document.getElementById('content')) { clearInterval(iv); fn(); }
    }, 10);
  }

  whenContentReady(function () {
    observeFirstWebFrame(document.getElementById('content'));
  });

  // Shared SWR path for both cold start and logo refresh.
  function loadHome(activePromise, devicesPromise, options) {
    options = options || {};
    var version = ++homeLoadVersion;
    if (!options.appendProjects) loadingRecentProjects = false;
    var cached = readCache();
    var hasCached = !!(cached && cached.active && cached.devices);
    var usePagePreview = !options.resetScroll && !!window.__returningHome;
    var isVisible = options.isCurrent || function () {
      return !!document.querySelector('.top-gear');
    };
    var isCurrent = function () { return version === homeLoadVersion && isVisible(); };

    setSync(true);
    whenContentReady(function () {
      if (!isCurrent()) return;
      document.body.classList.add('browse-view');
      setSync(true);
      if (options.keepContent) return;
      var restoredPreview = options.restoreSnapshot
        ? restoreReturningHomePreview(options.restoreSnapshot)
        : usePagePreview && (window.__homePreviewRestored || restoreReturningHomePreview());
      if (restoredPreview) setSync(true);
      if (!restoredPreview) {
        if (hasCached) renderInline(cached.active, cached.devices);
        else renderSkeleton(!!options.resetScroll);
      }
      if (options.resetScroll) document.getElementById('content').scrollTop = 0;
    });

    var run = Promise.all([Promise.resolve(activePromise), Promise.resolve(devicesPromise)]).then(function (fresh) {
      return new Promise(function (resolve, reject) {
        whenContentReady(function () {
          if (!isCurrent()) { resolve(fresh); return; }
          if (!fresh[0] || !fresh[1]) { reject(new Error('Home refresh failed')); return; }
          if (options.appendProjects) {
            fresh[0] = appendRecentProjects(fresh[0]);
          } else {
            var freshRaw = JSON.stringify({ active: fresh[0], devices: fresh[1] });
            var cachedRaw = hasCached ? JSON.stringify({ active: cached.active, devices: cached.devices }) : null;
            if (!window.__inlineRendered || freshRaw !== cachedRaw) {
              var content = document.getElementById('content');
              var keepScroll = content ? content.scrollTop : 0;
              renderInline(fresh[0], fresh[1]);
              if (content) content.scrollTop = keepScroll;
            }
          }
          writeCache(fresh[0], fresh[1]);
          if (options.onFresh) options.onFresh(fresh[0], fresh[1]);
          resolve(fresh);
        });
      });
    }).catch(function () {
      // Cache remains usable when revalidation fails.
      return null;
    }).then(function (fresh) {
      if (isCurrent()) stopSync();
      if (usePagePreview) {
        window.__returningHome = false;
        document.documentElement.classList.remove('returning-home');
      }
      return fresh;
    });

    window.__homeLoadPromise = run;
    run.then(function () {
      if (window.__homeLoadPromise === run) window.__homeLoadPromise = null;
    });
    return run;
  }
  window.__loadHome = loadHome;
  window.__setTopSync = setSync;

  if (willRenderInline) {
    loadHome(window.__preload.active, window.__preload.devices);
    window.__preload = null;
  } else {
    // Deep links render their own skeleton in app.js. The observer releases the
    // native overlay after that Web skeleton completes two layout frames.
    whenContentReady(function () {
      if (document.body) document.body.classList.add('ready');
    });
    // Deep link: preheat immediately, user is heading to a message view.
    Promise.all([window.__preload.active, window.__preload.devices]).then(function () {
      if (typeof window.loadViewerLibs === 'function') window.loadViewerLibs();
      else window.__preheatViewer = true;
    });
    stopSync(); // no home render here, but the gear was spinning from HTML — stop it
  }
})();
</script>

<script>
  // iOS only: reveal body after WKWebView frame settles (~50ms). No-op on Android.

  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
    var revealReady = function () { document.body && document.body.classList.add('ready'); };
    setTimeout(revealReady, 150);
    addEventListener('DOMContentLoaded', function () { setTimeout(revealReady, 50); });
  }
</script>

<!-- Input bar -->
<div id="input-bar" style="display:none">
  <div id="file-drop-hint" role="status">Drop to attach</div>
  <div id="slash-popup" style="display:none">
    <div class="slash-popup-title">Slash Commands</div>
    <div id="slash-list"></div>
  </div>
  <div id="img-preview-row" style="display:none"></div>
  <div class="input-row">
    <input type="file" id="img-picker" multiple style="display:none" onchange="onImagePicked(this)" />
    <button class="img-btn" onclick="openAttachmentPicker()" title="Add files"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <textarea id="msg-input" rows="1" placeholder="Send a message..." onpaste="onInputPaste(event)"></textarea>
    <button id="mic-btn" class="mic-btn" style="display:none" onclick="toggleDictation()" title="Voice input"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
    <button id="send-btn" disabled onclick="onSendBtnClick()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
  </div>
</div>

<!-- Scroll-to-bottom button -->
<button id="scroll-bottom-btn" class="scroll-bottom-btn" onclick="scrollToBottom()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
</button>

<!-- New Project modal -->
<div id="newProjectModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeNewProjectModal()">
  <div class="modal-box">
    <div class="modal-title">Project folder</div>
    <div class="new-project-path">
      <button id="newProjectUp" type="button" aria-label="Parent folder" title="Parent folder" onclick="newProjectParentDirectory()" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
      </button>
      <input id="newProjectInput" class="modal-input" type="text" aria-label="Project folder path" placeholder="e.g. ~/asset/demo" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" oninput="onNewProjectPathInput()" onkeydown="if(event.key==='Enter'){event.preventDefault();browseNewProjectPath();}if(event.key==='Escape')closeNewProjectModal();" />
    </div>
    <div id="newProjectDirectories" class="new-project-directories" aria-label="Folders"></div>
    <div class="modal-error" id="newProjectError"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeNewProjectModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="submitNewProject()">Create</button>
    </div>
  </div>
</div>

<!-- Delete confirmation -->
<div id="deleteModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeDeleteModal()">
  <div class="modal-box">
    <div class="modal-title" id="deleteModalTitle">Delete?</div>
    <div class="modal-desc" id="deleteModalDesc"></div>
    <label class="delete-toggle"><input type="checkbox" id="deleteFilesCb" onchange="onDeleteFilesToggle()"><span>Also delete the original data on the device</span></label>
    <div class="delete-hint" id="deleteHint">Removes the local jsonl files too, not just the list records — cannot be undone.</div>
    <div class="modal-error" id="deleteError"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeDeleteModal()">Cancel</button>
      <button class="modal-btn confirm danger" id="deleteConfirmBtn" onclick="submitDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- Codex writer takeover -->
<div id="codexTakeoverModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeCodexTakeoverModal()">
  <div class="modal-box codex-takeover-box">
    <div class="modal-title" id="codexTakeoverTitle">Codex session is active</div>
    <div class="modal-desc" id="codexTakeoverDesc"></div>
    <div class="modal-error" id="codexTakeoverError"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="codexTakeoverCancel" onclick="closeCodexTakeoverModal()">Cancel send</button>
      <button class="modal-btn confirm danger" id="codexTakeoverConfirm" onclick="confirmCodexTakeover()">Take over and send</button>
    </div>
  </div>
</div>

<div id="agentThreadsModal" class="modal-overlay agent-threads-overlay" style="display:none" onclick="if(event.target===this)closeAgentThreadsModal()">
  <div class="modal-box agent-threads-box" role="dialog" aria-modal="true" aria-label="Subagents">
    <div class="agent-threads-header">
      <div class="modal-title">Subagents</div>
      <button id="agentThreadsMain" class="agent-main-thread-btn" type="button"
        aria-label="Return to main session" title="Return to main session"
        onclick="switchAgentThread(this.dataset.sessionId)">Main Session</button>
    </div>
    <div id="agentThreadsList" class="agent-threads-list"></div>
  </div>
</div>

<!-- Image overlay -->
<div id="imgOverlay" class="img-overlay" style="display:none" role="dialog" aria-modal="true" aria-label="Image preview">
  <button type="button" class="img-overlay-close" aria-label="Close image preview"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button type="button" class="file-download-action img-overlay-download" title="Download image" aria-label="Download image" hidden></button>
  <img id="imgOverlayImg" />
</div>

<!-- File overlay -->
<div id="fileOverlay" class="file-overlay" style="display:none" onclick="if(event.target===this)closeFileViewer()">
  <div class="file-modal">
    <div class="file-modal-header">
      <span id="fileBackButton" class="file-back-slot"></span>
      <span id="fileOverlayTitle" class="file-modal-title"></span>
      <button type="button" id="file-download-btn" class="file-action file-download-action" onclick="downloadViewedFile()" title="Download file" aria-label="Download file"></button>
      <span id="fileOverlayTabs" class="file-tabs" style="display:none">
        <button class="file-tab" data-mode="diff" style="display:none" onclick="setFileViewMode('diff')">Diff</button>
        <button class="file-tab active" data-mode="source" onclick="setFileViewMode('source')">Code</button>
        <button class="file-tab" data-mode="preview" onclick="setFileViewMode('preview')">Preview</button>
      </span>
    </div>
    <div id="fileOverlayBody" class="file-modal-body"></div>
  </div>
</div>

</body>
</html>
