<style>
  #ap-capsule-preview {
    --ap-surface: light-dark(#ffffff, #101419);
    --ap-chrome: light-dark(#f7f8fa, #161b22);
    --ap-group: light-dark(#eceef1, #242b34);
    --ap-border: light-dark(#e0e4e9, #2d3540);
    --ap-text: light-dark(#252c36, #e5eaf0);
    --ap-muted: light-dark(#67717f, #96a0ad);
    --ap-active: light-dark(#ffffff, #38424e);
    --ap-green: light-dark(#15704f, #a4e5ca);
    --ap-shadow: light-dark(#18212e12, #00000040);
    --ap-radius: 12px;
    width: 100%;
    color: var(--ap-text);
    font: 400 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #ap-capsule-preview * { box-sizing: border-box; }
  #ap-capsule-preview [hidden] { display: none !important; }
  #ap-capsule-preview .ap-window {
    background: var(--ap-surface);
    border: 1px solid var(--ap-border);
    border-radius: 16px;
    overflow: clip;
  }
  #ap-capsule-preview .ap-header {
    min-height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--ap-border);
  }
  #ap-capsule-preview .ap-project { display: flex; align-items: center; gap: 12px; }
  #ap-capsule-preview .ap-project-name { font-size: 15px; font-weight: 500; }
  #ap-capsule-preview .ap-project-meta { color: var(--ap-muted); font-size: 11px; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  #ap-capsule-preview .ap-tools { display: flex; align-items: center; gap: 3px; padding: 4px; border-radius: calc(var(--ap-radius) + 4px); background: var(--ap-group); }
  #ap-capsule-preview button { font: inherit; cursor: pointer; }
  #ap-capsule-preview .ap-icon {
    position: relative;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    width: 36px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: var(--ap-radius);
    color: var(--ap-muted);
    background: transparent;
    transition: background 120ms, color 120ms;
  }
  #ap-capsule-preview .ap-icon:hover { color: var(--ap-text); background: var(--ap-active); }
  #ap-capsule-preview .ap-trigger[aria-expanded="true"] { color: var(--ap-green); background: var(--ap-active); box-shadow: 0 1px 3px var(--ap-shadow); }
  #ap-capsule-preview .ap-trigger[aria-expanded="true"]::after { content: ""; position: absolute; bottom: 3px; left: calc(50% - 5px); width: 10px; height: 2px; border-radius: 2px; background: currentColor; }
  #ap-capsule-preview[data-label="true"] .ap-trigger { width: auto; padding: 0 12px; }
  #ap-capsule-preview .ap-body { min-height: 288px; padding: 20px; background: var(--ap-chrome); }
  #ap-capsule-preview .ap-session { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ap-muted); margin-bottom: 18px; }
  #ap-capsule-preview .ap-popover { width: min(100%, 464px); margin-left: auto; position: relative; border: 1px solid var(--ap-border); border-radius: 13px; background: var(--ap-surface); box-shadow: 0 10px 28px var(--ap-shadow); }
  #ap-capsule-preview .ap-popover-header { display: flex; align-items: center; gap: 9px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--ap-border); }
  #ap-capsule-preview .ap-popover-title { font-weight: 500; }
  #ap-capsule-preview .ap-shell { color: var(--ap-muted); font: 400 11px/1.5 "SFMono-Regular", Consolas, monospace; }
  #ap-capsule-preview .ap-close { margin-left: auto; }
  #ap-capsule-preview .ap-console { min-height: 134px; padding: 18px 18px 22px; font: 400 12px/1.9 "SFMono-Regular", Consolas, monospace; overflow-wrap: anywhere; }
  #ap-capsule-preview .ap-prompt { color: var(--ap-green); }
  #ap-capsule-preview .ap-path { color: var(--ap-muted); margin: 3px 0 13px; }
  #ap-capsule-preview .ap-cursor { display: inline-block; width: 7px; height: 13px; background: var(--ap-green); vertical-align: -2px; margin-left: 5px; }
  #ap-capsule-preview .ap-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 16px; border-top: 1px solid var(--ap-border); color: var(--ap-muted); font-size: 11px; }
  @media (max-width: 390px) {
    #ap-capsule-preview .ap-header { padding: 14px; gap: 10px; }
    #ap-capsule-preview .ap-body { padding: 18px 12px; }
    #ap-capsule-preview .ap-project { gap: 8px; }
    #ap-capsule-preview .ap-tools { margin-left: auto; }
  }
  @media (pointer: coarse) {
    #ap-capsule-preview .ap-icon { width: 44px; height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #ap-capsule-preview .ap-icon { transition: none; }
  }
</style>
<div id="ap-capsule-preview" aria-label="顶部命令行 · 极简胶囊样式">
  <section class="ap-window" aria-label="AgentPeek 顶部设计预览">
    <header class="ap-header">
      <div class="ap-project">
        <i data-lucide="layers-2" aria-hidden="true"></i>
        <div>
          <div class="ap-project-name">agentpeek</div>
          <div class="ap-project-meta"><i data-lucide="git-branch" aria-hidden="true"></i><span>main</span></div>
        </div>
      </div>
      <nav class="ap-tools" aria-label="工作区工具">
        <button class="ap-icon" type="button" aria-label="文件" data-tooltip="文件"><i data-lucide="folder" aria-hidden="true"></i></button>
        <button class="ap-icon" type="button" aria-label="Git 变更" data-tooltip="Git 变更"><i data-lucide="git-branch" aria-hidden="true"></i></button>
        <button class="ap-icon ap-trigger" type="button" aria-label="命令行" aria-expanded="true" aria-controls="ap-capsule-terminal" data-tooltip="命令行">
          <i data-lucide="terminal" aria-hidden="true"></i><span class="ap-button-label" hidden>命令行</span>
        </button>
      </nav>
    </header>
    <div class="ap-body">
      <div class="ap-session"><i data-lucide="message-square" aria-hidden="true"></i><span>顶部命令行入口设计</span></div>
      <section class="ap-popover" id="ap-capsule-terminal" aria-label="命令行浮层预览">
        <header class="ap-popover-header">
          <i data-lucide="terminal" aria-hidden="true"></i>
          <span class="ap-popover-title">命令行</span><span class="ap-shell">zsh</span>
          <button class="ap-icon ap-close" type="button" aria-label="关闭命令行" data-tooltip="关闭命令行"><i data-lucide="x" aria-hidden="true"></i></button>
        </header>
        <div class="ap-console" aria-label="终端内容样式示例，不执行命令">
          <div><span class="ap-prompt">agentpeek ❯</span> pwd</div>
          <div class="ap-path">/Users/xiaoweii/workspace/rn/agentpeek</div>
          <div><span class="ap-prompt">agentpeek ❯</span><span class="ap-cursor" aria-hidden="true"></span></div>
        </div>
        <footer class="ap-footer"><span>项目终端</span><span>样式预览</span></footer>
      </section>
    </div>
  </section>
</div>
<script>
  (() => {
    const root = document.getElementById('ap-capsule-preview');
    const trigger = root.querySelector('.ap-trigger');
    const label = root.querySelector('.ap-button-label');
    const panel = root.querySelector('.ap-popover');
    const close = root.querySelector('.ap-close');
    const state = { expanded: true, showLabel: false, radius: 12 };
    function render() {
      root.dataset.label = String(state.showLabel);
      root.style.setProperty('--ap-radius', `${state.radius}px`);
      label.hidden = !state.showLabel;
      panel.hidden = !state.expanded;
      trigger.setAttribute('aria-expanded', String(state.expanded));
    }
    trigger.addEventListener('click', () => { state.expanded = !state.expanded; render(); });
    close.addEventListener('click', () => { state.expanded = false; render(); trigger.focus(); });
    root.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.expanded) { state.expanded = false; render(); trigger.focus(); }
    });
    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: root, onChange: render });
      tweak.addToggle(state, 'expanded', { label: '展开命令行' });
      tweak.addToggle(state, 'showLabel', { label: '显示命令行文字' });
      tweak.addSlider(state, 'radius', { label: '胶囊圆角', min: 6, max: 17, unit: 'px' });
    }
  })();
</script>
